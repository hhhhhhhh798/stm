name: Server tests

on:
  push:
    paths: ['server/**']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The watch-party modules only need `ws` (the rest of the API needs the full dependency list).
      - name: Install test dependency
        run: cd server && npm install ws@8 --no-save --no-audit --no-fund
      - name: Run tests
        run: cd server && node --test test/*.test.js
