plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stream.master'
    compileSdk 35
    ndkVersion '29.0.14206865'

    def expectedCertSha256 = (project.findProperty('EXPECTED_CERT_SHA256') ?: System.getenv('EXPECTED_CERT_SHA256') ?: '').toString().trim()

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.stream.master'
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName '4.12.0'

        buildConfigField 'String', 'EXPECTED_CERT_SHA256', '"' + expectedCertSha256 + '"'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }

        resourceConfigurations += ['ar', 'es']
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }

        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'org.jsoup:jsoup:1.16.1'

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Unity LevelPlay Interstitial
    implementation('com.unity3d.ads-mediation:mediation-sdk:9.5.0') {
        exclude group: 'com.unity3d.ads-mediation', module: 'adquality-sdk'
    }

    implementation 'com.unity3d.ads-mediation:adquality-sdk:9.8.0'

    implementation 'com.google.android.gms:play-services-appset:16.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.1.0'

    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.work:work-runtime-ktx:2.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    implementation 'me.relex:circleindicator:2.1.6'
    implementation 'com.airbnb.android:lottie:6.4.0'

    implementation 'com.eclipsesource.j2v8:j2v8:6.3.4'

    implementation 'com.google.protobuf:protobuf-kotlin-lite:3.25.6'

    // Watch Party voice chat: WebRTC (audio-only mesh over the existing room WebSocket for signaling).
    // Maintained mirror of the official binaries (Google stopped publishing to Maven Central).
    implementation 'io.getstream:stream-webrtc-android:1.1.1'
    implementation 'androidx.datastore:datastore:1.1.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
}

// Avoid Kotlin stdlib jdk7/jdk8 duplicate-class conflict
// from the tested LevelPlay dependency stack.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
